<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Telegram Drive</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>⚙ Admin Panel</h1>
    <div class="topbar-right">
      <a href="index.html" class="admin-link">← Kembali ke Drive</a>
      <span id="whoami"></span>
      <button id="logoutBtn">Keluar</button>
    </div>
  </header>

  <main class="drive-wrap">
    <div id="statsRow" class="stats-row"></div>

    <h2 class="section-title">Semua User</h2>
    <div class="table-scroll">
      <table id="adminTable" class="drive-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Terdaftar</th>
            <th>Storage</th>
            <th>Admin</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>
    </div>
  </main>

<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
