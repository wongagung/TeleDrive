<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Telegram Drive</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js" defer></script>
<script src="protect.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand"><h1>⚙ Admin Panel</h1></div>
    <div class="topbar-right">
      <a href="index.html" class="admin-link">← Kembali ke Drive</a>
      <span id="whoami"></span>
      <button id="logoutBtn">Keluar</button>
    </div>
  </header>

  <main class="drive-wrap">
    <div id="statsRow" class="stats-row"></div>

    <h2 class="section-title">Semua User</h2>
    <div class="table-scroll" id="adminTableScroll">
      <div id="adminTable" class="admin-grid">
        <div class="admin-grid-row admin-grid-head">
          <div>Username</div>
          <div>Terdaftar</div>
          <div>Storage</div>
          <div>Admin</div>
          <div></div>
        </div>
        <div id="userBody"></div>
      </div>
    </div>
  </main>

<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
