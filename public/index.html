<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Telegram Drive</title>
<link rel="stylesheet" href="style.css?v=20260812" />
</head>
<body>
  <header class="topbar">
    <h1>📁 Telegram Drive</h1>
    <div class="topbar-right">
      <div class="quota-box">
        <div class="bar quota-bar"><div id="quotaBarFill" class="bar-fill"></div></div>
        <span id="quotaText" class="quota-text"></span>
      </div>
      <span id="whoami"></span>
      <a id="adminLink" href="admin.html" class="admin-link" hidden>⚙ Admin</a>
      <button id="logoutBtn" class="logout-btn" type="button">Keluar</button>
    </div>
  </header>
  <main class="drive-wrap">
    <div class="toolbar">
      <nav id="breadcrumb" class="breadcrumb"></nav>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Cari nama file..." />
      </div>
      <div class="actions">
        <button id="newFolderBtn" type="button">+ Folder</button>
        <label class="upload-btn">
          ⬆ Upload
          <input type="file" id="fileInput" hidden />
        </label>
      </div>
    </div>
    <div id="bulkToolbar" class="bulk-toolbar" hidden>
      <span id="bulkCount"></span>
      <div class="bulk-actions">
        <button id="bulkMoveBtn" type="button">📂 Pindahkan</button>
        <button id="bulkDeleteBtn" class="danger-btn" type="button">🗑 Hapus</button>
        <button id="bulkCancelBtn" type="button">Batal</button>
      </div>
    </div>

    <div id="uploadProgress" class="upload-progress" hidden>
      <div class="bar"><div id="uploadBar" class="bar-fill"></div></div>
      <span id="uploadStatus"></span>
    </div>
    <div id="searchResults" class="search-results" hidden>
      <p id="searchInfo" class="search-info"></p>
      <table class="drive-table">
        <thead><tr><th>Nama</th><th>Lokasi</th><th>Ukuran</th><th></th></tr></thead>
        <tbody id="searchBody"></tbody>
      </table>
    </div>
    <table id="mainTable" class="drive-table">
      <thead>
        <tr><th>Nama</th><th>Ukuran</th><th>Tanggal</th><th></th></tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
    <p id="emptyMsg" class="empty" hidden>Folder ini kosong.</p>
  </main>

  <div id="previewModal" class="modal-overlay" hidden>
    <div class="modal-box modal-preview">
      <div class="modal-header">
        <span id="previewTitle"></span>
        <button id="previewClose" class="modal-close" type="button">✕</button>
      </div>
      <div id="previewBody" class="modal-body"></div>
    </div>
  </div>

  <div id="moveModal" class="modal-overlay" hidden>
    <div class="modal-box modal-move">
      <div class="modal-header">
        <span id="moveTitle"></span>
        <button id="moveClose" class="modal-close" type="button">✕</button>
      </div>
      <nav id="moveBreadcrumb" class="breadcrumb"></nav>
      <div id="moveBody" class="move-list"></div>
      <div class="modal-footer">
        <button id="moveHereBtn" class="primary-btn" type="button">Pindahkan ke sini</button>
      </div>
    </div>
  </div>

<script src="auth.js?v=20260812"></script>
<script src="app.js?v=20260812"></script>
</body>
</html>
