<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Telegram Drive</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<script src="theme.js" defer></script>
<script src="protect.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <h1>📁 Telegram Drive</h1>
    </div>

    <div class="topbar-search">
      <div class="search-box">
        <span class="topbar-search-icon" aria-hidden="true">🔍</span>
        <input type="text" id="searchInput" placeholder="Cari nama file..." autocomplete="off" />
      </div>
    </div>

    <div class="topbar-right">
      <div class="quota-box">
        <div class="bar quota-bar"><div id="quotaBarFill" class="bar-fill"></div></div>
        <span id="quotaText" class="quota-text"></span>
      </div>
      <span id="whoami"></span>
      <a id="adminLink" href="admin.html" class="admin-link" hidden>⚙ Admin</a>
      <button id="telegramLinkBtn" class="admin-link" title="Hubungkan Telegram buat notifikasi kuota">🔗 Telegram</button>
      <button id="logoutBtn">Keluar</button>
    </div>
  </header>

  <main class="drive-wrap">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="folderBackBtn" class="nav-btn" type="button" title="Folder sebelumnya" disabled>←</button>
        <button id="folderForwardBtn" class="nav-btn" type="button" title="Folder berikutnya" disabled>→</button>
        <nav id="breadcrumb" class="breadcrumb"></nav>
      </div>
      <div class="actions">
        <label class="select-all-control">
          <input type="checkbox" id="selectAllBox" />
          <span>Pilih semua</span>
        </label>
        <div class="sort-control">
          <select id="sortSelect" title="Urutkan berdasarkan">
            <option value="name">Nama</option>
            <option value="size">Ukuran</option>
            <option value="date">Tanggal</option>
          </select>
          <button id="sortDirBtn" type="button" title="Ubah arah urutan">↑</button>
        </div>
        <div class="view-toggle">
          <button id="viewListBtn" title="Tampilan list">☰</button>
          <button id="viewGridBtn" title="Tampilan grid">▦</button>
        </div>
        <button id="newFolderBtn">+ Folder</button>
        <div class="upload-menu-wrap">
          <button id="uploadMenuBtn" class="upload-btn" type="button">⬆ Upload ▾</button>
          <div id="uploadMenu" class="upload-menu" hidden>
            <label class="upload-menu-item">
              📁 Berkas
              <input type="file" id="fileInputFiles" multiple hidden />
            </label>
            <label class="upload-menu-item">
              🖼️ Galeri
              <input type="file" id="fileInputGallery" accept="image/*,video/*" multiple hidden />
            </label>
          </div>
        </div>
      </div>
    </div>

    <div id="bulkToolbar" class="bulk-toolbar" hidden>
      <span id="bulkCount"></span>
      <div class="bulk-actions">
        <button id="bulkMoveBtn">📂 Pindahkan</button>
        <button id="bulkDeleteBtn" class="danger-btn">🗑 Hapus</button>
        <button id="bulkCancelBtn">Batal</button>
      </div>
    </div>

    <div id="uploadProgress" class="upload-progress" hidden>
      <div class="bar"><div id="uploadBar" class="bar-fill"></div></div>
      <span id="uploadStatus"></span>
    </div>

    <div id="searchResults" class="search-results" hidden>
      <p id="searchInfo" class="search-info"></p>
      <table class="drive-table">
        <thead><tr><th>Nama</th><th>Lokasi</th><th>Ukuran</th><th></th></tr></thead>
        <tbody id="searchBody"></tbody>
      </table>
    </div>

    <div class="table-scroll">
      <table id="mainTable" class="drive-table">
        <thead><tr>
          <th data-sort-key="name">Nama</th>
          <th data-sort-key="size">Ukuran</th>
          <th data-sort-key="date">Tanggal</th>
          <th></th>
        </tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>

    <div id="gridView" class="grid-view" hidden></div>
    <p id="emptyMsg" class="empty" hidden>Folder ini kosong.</p>
  </main>

  <div id="previewModal" class="modal-overlay" hidden>
    <div class="modal-box modal-preview">
      <div class="modal-header"><span id="previewTitle"></span><button id="previewClose" class="modal-close">✕</button></div>
      <div id="previewBody" class="modal-body"></div>
    </div>
  </div>

  <div id="moveModal" class="modal-overlay" hidden>
    <div class="modal-box modal-move">
      <div class="modal-header"><span id="moveTitle"></span><button id="moveClose" class="modal-close">✕</button></div>
      <nav id="moveBreadcrumb" class="breadcrumb"></nav>
      <div id="moveBody" class="move-list"></div>
      <div class="modal-footer"><button id="moveHereBtn" class="primary-btn">Pindahkan ke sini</button></div>
    </div>
  </div>

  <div id="telegramModal" class="modal-overlay" hidden>
    <div class="modal-box modal-move">
      <div class="modal-header"><span>🔗 Hubungkan Telegram</span><button id="telegramModalClose" class="modal-close">✕</button></div>
      <div id="telegramModalBody" class="telegram-link-body"></div>
    </div>
  </div>

  <div id="dropOverlay" class="drop-overlay" hidden>
    <div class="drop-overlay-inner">📥 Lepas file di sini untuk upload</div>
  </div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
